<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The requested SimUoPLabs page could not be found." />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#0b0c0e" />
  <link rel="canonical" href="https://simuoplabs.github.io/404.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Page Not Found | SimUoPLabs</title>
  <style>
    :root { color-scheme: dark; --ink:#0b0c0e; --paper:#ece9e0; --signal:#c8ff2e; --blue:#7cc4ff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--ink); color:var(--paper); font-family:Arial, sans-serif; }
    main { width:min(760px, 100%); border-left:4px solid var(--signal); padding:clamp(28px, 6vw, 64px); background:rgba(124,196,255,.08); }
    p { max-width:52ch; color:#bbb8af; font-size:18px; line-height:1.6; }
    .code { color:var(--signal); font-family:ui-monospace, monospace; letter-spacing:2px; }
    h1 { margin:12px 0; font-size:clamp(42px, 9vw, 76px); line-height:1; letter-spacing:0; }
    a { display:inline-block; margin-top:20px; padding:13px 18px; background:var(--signal); color:var(--ink); font-weight:700; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--blue); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR / 404</div>
    <h1>Page not found.</h1>
    <p>The address does not point to a live SimUoPLabs page. Return to the research team home page to continue.</p>
    <a href="index.html">Return home</a>
    <p><a href="privacy.html" style="padding:0;background:none;color:var(--signal);font-weight:400">Privacy Policy</a></p>
  </main>
</body>
</html>
